defaults:
  - _self_
  - trainer: defaults
  - optimizer: adam
  - lr_scheduler: inv_sqrt_w_linear_ramps
  - model: isotropic_model
  - data: all_2d
  - experiment: defaults
  - server: ???
  - distribution: local
  - logger: wandb
  - checkpoint: defaults
  - finetuning_mods: defaults
data_workers: 14
name: default_name
finetune: False
automatic_setup: True
# Seeds everything random: weight init, then at every epoch all RNGs from (seed, rank, epoch),
# including the dataset order and the window draws (walrus/utils/experiment_utils.py::seed_from).
# A resumed epoch is therefore identical to the uninterrupted one (tests/test_determinism.py).
seed: 0
